name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller mss==10.2.0
      - name: Build one-file EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name "AC6-WinLoss-Tracker"
          --add-data "overlay.html;."
          --add-data "detector_templates.json;."
          app.py
      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/AC6-WinLoss-Tracker.exe release/
          Copy-Item README.txt release/
          Copy-Item Create-Diagnostic-Report.bat release/
          Compress-Archive -Path release/* -DestinationPath AC6-WinLoss-Tracker-Windows.zip

      - name: Determine MSIX version
        id: msix_version
        shell: pwsh
        run: |
          $version = $null
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$') {
            $parts = @([int64]$Matches[1], [int64]$Matches[2], [int64]$Matches[3])
            if ($parts | Where-Object { $_ -gt 65535 }) {
              throw "MSIX version components must be in the range 0..65535: $env:GITHUB_REF_NAME"
            }
            $version = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          } else {
            # A monotonically useful, schema-safe version for workflow_dispatch.
            $build = [int64]$env:GITHUB_RUN_NUMBER % 65535
            if ($build -eq 0) { $build = 1 }
            $version = "1.0.$build.0"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "MSIX version: $version"

      - name: Stage and build unsigned Store MSIX
        id: msix
        shell: pwsh
        env:
          MSIX_VERSION: ${{ steps.msix_version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $PWD 'msix'
          New-Item -ItemType Directory -Force (Join-Path $staging 'Assets') | Out-Null
          Copy-Item dist/AC6-WinLoss-Tracker.exe $staging/
          Copy-Item store/Assets/*.png (Join-Path $staging 'Assets')/

          $manifest = (Get-Content store/AppxManifest.template.xml -Raw).Replace('__MSIX_VERSION__', $env:MSIX_VERSION)
          $manifestPath = Join-Path $staging 'AppxManifest.xml'
          [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makeAppx = Get-ChildItem $sdkRoot -Filter MakeAppx.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\MakeAppx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) {
            $fallback = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\App Certification Kit\MakeAppx.exe'
            if (Test-Path $fallback) { $makeAppx = Get-Item $fallback }
          }
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found in the installed Windows SDK.' }
          Write-Host "Using MakeAppx: $($makeAppx.FullName)"

          $packageName = "AC6-WinLoss-Tracker_${env:MSIX_VERSION}_x64.msix"
          $packagePath = Join-Path $PWD $packageName
          & $makeAppx.FullName pack /d $staging /p $packagePath /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx pack failed with exit code $LASTEXITCODE" }
          "path=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate MSIX contents and manifest
        shell: pwsh
        env:
          MSIX_VERSION: ${{ steps.msix_version.outputs.version }}
          MSIX_PATH: ${{ steps.msix.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:MSIX_PATH)) { throw "MSIX not found: $env:MSIX_PATH" }

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makeAppx = Get-ChildItem $sdkRoot -Filter MakeAppx.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\MakeAppx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) {
            $fallback = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\App Certification Kit\MakeAppx.exe'
            if (Test-Path $fallback) { $makeAppx = Get-Item $fallback }
          }
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found for validation.' }

          $unpacked = Join-Path $PWD 'msix-validation'
          & $makeAppx.FullName unpack /p $env:MSIX_PATH /d $unpacked /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx unpack validation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $unpacked 'AC6-WinLoss-Tracker.exe'))) { throw 'Packaged EXE is missing.' }

          [xml]$xml = Get-Content (Join-Path $unpacked 'AppxManifest.xml') -Raw
          $ns = [System.Xml.XmlNamespaceManager]::new($xml.NameTable)
          $ns.AddNamespace('f', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity = $xml.SelectSingleNode('/f:Package/f:Identity', $ns)
          if ($identity.Name -ne 'TullysAC6.AC6WinLossTracker') { throw "Unexpected Identity Name: $($identity.Name)" }
          if ($identity.Publisher -ne 'CN=9F902EFC-0902-4564-8FE8-18CB1C21128F') { throw "Unexpected Publisher: $($identity.Publisher)" }
          if ($identity.Version -ne $env:MSIX_VERSION) { throw "Unexpected Version: $($identity.Version)" }
          if ($identity.ProcessorArchitecture -ne 'x64') { throw "Unexpected architecture: $($identity.ProcessorArchitecture)" }
          Write-Host "Validated unsigned MSIX: $env:MSIX_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: AC6-WinLoss-Tracker-Windows
          path: AC6-WinLoss-Tracker-Windows.zip

      - name: Upload unsigned Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC6-WinLoss-Tracker-MSIX-${{ steps.msix_version.outputs.version }}-x64
          path: ${{ steps.msix.outputs.path }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            The ZIP is the current general-user distribution.

            The attached MSIX is an unsigned Microsoft Store submission artifact. It is not intended for direct sideloading; Microsoft Store will apply the production signature. The Microsoft Store edition will become the recommended distribution when available.
          files: |
            AC6-WinLoss-Tracker-Windows.zip
            ${{ steps.msix.outputs.path }}
