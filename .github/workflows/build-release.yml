name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller mss==10.2.0
      - name: Build one-file EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name "AC6-WinLoss-Tracker"
          --add-data "overlay.html;."
          --add-data "detector_templates.json;."
          app.py
      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/AC6-WinLoss-Tracker.exe release/
          Copy-Item README.txt release/
          Copy-Item Create-Diagnostic-Report.bat release/
          Compress-Archive -Path release/* -DestinationPath AC6-WinLoss-Tracker-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AC6-WinLoss-Tracker-Windows
          path: AC6-WinLoss-Tracker-Windows.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AC6-WinLoss-Tracker-Windows.zip
