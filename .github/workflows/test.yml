name: Windows tests

on:
  push:
    branches:
      - main
      - beta
      - test/python-source-install
      - release/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  windows-tests:
    name: Windows tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Record runtime details
        shell: pwsh
        run: |
          python --version
          python -c "import platform, sqlite3, struct; print('architecture=' + platform.architecture()[0]); print('pointer_bits=' + str(struct.calcsize('P') * 8)); print('sqlite=' + sqlite3.sqlite_version)"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Audit dependencies
        if: matrix.python-version != '3.12'
        run: python -m pip install pip-audit && python -m pip_audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List -Force
            throw "install.ps1 has PowerShell syntax errors"
          }

      - name: Validate Runtime Policy
        run: python tests/test_runtime_policy.py && python tests/test_runtime_guard.py

      - name: Validate installer Runtime Policy
        shell: pwsh
        run: ./tests/test_runtime_policy_installer.ps1

      - name: Run launcher tests
        if: matrix.python-version != '3.12'
        run: python tests/test_launcher.py

      - name: Run full regression suite after launcher passes
        if: matrix.python-version != '3.12'
        run: python tests/run_all_tests.py
