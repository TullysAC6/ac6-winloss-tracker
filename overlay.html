<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AC6 Win/Loss Tracker</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{font-family:"Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif}
/* Stats panel at 22,22 and the warning stack at 18 px from the top right, as
   before. Sharing one wrapping row means that on a narrow Browser Source the
   warnings drop below the panel instead of covering it. A source too short for
   that keeps them at the top right, over the panel as before, so a warning is
   never pushed off the page. */
#top-bar{position:fixed;left:22px;right:18px;top:18px;z-index:1000;display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;pointer-events:none}
#stats-panel{display:none;box-sizing:border-box;max-width:100%;margin-top:4px;padding:10px 14px 8px;background:rgba(0,0,0,.50);border:1px solid rgba(255,255,255,.30);border-radius:6px;color:#fff;font-size:24px;font-weight:800;text-shadow:0 2px 2px #000;pointer-events:none}
#stats-panel .record,#stats-panel .rate,#stats-panel .streak,#stats-panel .status{display:inline-block}
#stats-panel .status{margin-left:12px;font-weight:900}
#stats-panel .sub{display:block;margin-top:3px;font-size:15px;opacity:.80;text-align:right}
/* Streak status: coloured and static. Only the milestone banner moves. */
#stats-panel.hot-1 .status{color:#ffb04a;text-shadow:0 0 3px rgba(255,140,50,.65),0 2px 2px #000}
#stats-panel.hot-2 .status{color:#ff4a3d;text-shadow:0 0 5px rgba(255,55,35,.80),0 2px 2px #000}
#stats-panel.hot-3 .status{color:#ffd740;text-shadow:0 0 6px #ffb300,0 2px 2px #000}
#stats-panel.hot-4 .status{color:#fff176;text-shadow:0 0 8px #ffd600,0 2px 2px #000}
#stats-panel.hot-5{border-color:#ffe66a}
#stats-panel.hot-5 .status{color:#fff;text-shadow:0 0 9px #ffe45c,0 2px 2px #000}
#health-warnings{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-left:auto;max-width:100%;pointer-events:none}
.health-warning{display:none;box-sizing:border-box;max-width:100%;padding:6px 9px;background:rgba(120,0,0,.82);color:#fff;font-size:16px;font-weight:900;border-radius:4px;pointer-events:none}
@media (max-height:299px){#health-warnings{position:fixed;right:18px;top:18px;z-index:1200}}
#milestone{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;pointer-events:none}
#milestone.show{display:flex}
#milestone .inner{position:relative;padding:18px 42px;background:linear-gradient(180deg,rgba(90,12,0,.90),rgba(10,0,0,.86));border:3px solid #ffd94a;border-radius:8px;color:#fff166;font-size:68px;font-weight:900;letter-spacing:.04em;box-shadow:0 0 12px rgba(255,190,40,.45),inset 0 0 10px rgba(255,220,80,.18);text-shadow:0 0 4px #ff9c20,0 3px 4px #000;animation:milestone 1.8s ease-out forwards}
#milestone .inner::before,#milestone .inner::after{content:"";position:absolute;left:8%;right:8%;height:2px;background:rgba(255,230,100,.85);box-shadow:0 0 5px rgba(255,205,60,.7)}
#milestone .inner::before{top:7px}
#milestone .inner::after{bottom:7px}
#milestone.effect-30 .inner,#milestone.effect-35 .inner,#milestone.effect-40 .inner,#milestone.effect-45 .inner{background:linear-gradient(180deg,rgba(75,10,100,.95),rgba(15,0,30,.90));border-color:#d68cff;box-shadow:0 0 22px rgba(190,90,255,.8),inset 0 0 14px rgba(220,150,255,.35)}
#milestone.effect-40 .inner,#milestone.effect-45 .inner{font-size:78px;box-shadow:0 0 34px rgba(220,120,255,.95),inset 0 0 22px rgba(240,180,255,.5)}
#milestone.effect-50 .inner{font-size:92px;background:radial-gradient(circle,#fff3a0,#f5a900 35%,#4b1600 100%);color:#fff;border-color:#fff2a0;box-shadow:0 0 55px #ffd000,inset 0 0 30px #fff}
@keyframes milestone{0%{opacity:0;transform:scale(.82)}12%{opacity:1;transform:scale(1.08)}28%{opacity:.45;transform:scale(1)}42%{opacity:1;transform:scale(1.04)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.02)}}
</style>
</head>
<body>
<div id="top-bar">
<div id="stats-panel"><span class="record"></span><span class="rate"></span><span class="streak"></span><span class="status"></span><span class="sub"></span></div>
<div id="health-warnings">
<div id="detector-warning" class="health-warning">勝敗自動検出 停止</div>
<div id="stats-warning" class="health-warning">戦績データ異常</div>
<div id="config-warning" class="health-warning">設定ファイル異常</div>
</div>
</div>
<div id="milestone"><div class="inner"></div></div>
<script>
(async()=>{
  const statsPanel=document.getElementById("stats-panel");
  const detectorWarning=document.getElementById("detector-warning");
  const statsWarning=document.getElementById("stats-warning");
  const configWarning=document.getElementById("config-warning");
  const milestone=document.getElementById("milestone");
  const milestoneInner=milestone.querySelector(".inner");
  let statsEnabled=true,latestStats=null,milestoneTimer=null,latestLifetime=null,statsScope="session",showBest=true;
  const overlayStartedAt=Date.now(),effectTtlMs=3000;
  const seenEffects=new Map();
  let lastEffectCreatedAt=0;

  async function fetchConfig(){const r=await fetch("/config",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
  function hideMilestone(){milestone.classList.remove("show");if(milestoneTimer){clearTimeout(milestoneTimer);milestoneTimer=null}}
  // 最高連勝 is hidden only by an explicit false: a missing field (older server) keeps it shown.
  function applyConfig(c){statsEnabled=c.stats_enabled!==false;statsScope=c.overlay_stats_scope==="lifetime"?"lifetime":"session";showBest=c.broadcast_show_best_streak!==false;if(!statsEnabled){statsPanel.style.display="none";hideMilestone()}else{refreshStats()}const h=c.config_health||{};const bad=h.status==="degraded";configWarning.style.display=bad?"block":"none";if(bad)configWarning.textContent="設定ファイル異常（前回正常値で継続）"}
  try{applyConfig(await fetchConfig())}catch(e){console.error("[config]",e)}
  setInterval(async()=>{try{applyConfig(await fetchConfig())}catch(e){console.error("[config]",e)}},3000);

  function milestoneText(n){return({5:"5連勝　激アツ!!",10:"10連勝　超激アツ!!",15:"15連勝　覚醒ゾーン突入",20:"20連勝　RUSH突入!!",25:"25連勝　RUSH継続!!",30:"30連勝!!",35:"35連勝!!",40:"40連勝!!",45:"45連勝!!",50:"50連勝　LEGEND"})[n]||`${n}連勝!!`}
  function flashMilestone(n){if(!statsEnabled||!n)return;if(milestoneTimer)clearTimeout(milestoneTimer);milestone.className="";milestone.id="milestone";milestone.classList.add(`effect-${Number(n)}`);milestoneInner.textContent=milestoneText(Number(n));milestone.classList.add("show");milestoneTimer=setTimeout(()=>{milestone.classList.remove("show");milestone.className="";milestone.id="milestone";milestoneTimer=null},3000)}
  function renderStats(s){if(!statsEnabled){statsPanel.style.display="none";return}statsPanel.style.display="block";statsPanel.querySelector(".record").textContent=`WIN ${s.wins}　LOSE ${s.losses}`;statsPanel.querySelector(".rate").textContent=`　勝率 ${Number(s.win_rate).toFixed(1)}%`;statsPanel.querySelector(".streak").textContent=`　連勝 ${s.streak}`;statsPanel.querySelector(".status").textContent=s.status_level?`　${s.status}`:"";const sub=statsPanel.querySelector(".sub");sub.textContent=showBest?`${s.scope_label||""}最高連勝 ${s.best_streak}`:"";sub.style.display=showBest?"":"none";statsPanel.className="";statsPanel.id="stats-panel";if(s.status_level)statsPanel.classList.add("hot-"+s.status_level)}
  function updateStats(s){latestStats=s;refreshStats()}
  function usableLifetime(d){return d&&["wins","losses","win_rate","best_streak"].every(k=>typeof d[k]==="number"&&isFinite(d[k]))}
  function statsView(){if(!latestStats)return null;if(statsScope!=="lifetime"||!usableLifetime(latestLifetime))return latestStats;
    return Object.assign({},latestStats,{wins:latestLifetime.wins,losses:latestLifetime.losses,win_rate:latestLifetime.win_rate,best_streak:latestLifetime.best_streak,scope_label:"累計　"})}
  function refreshStats(){const view=statsView();if(view)renderStats(view)}
  function updateDetector(d){const bad=d.status==="error"||d.status==="degraded";detectorWarning.style.display=bad?"block":"none";if(bad)detectorWarning.textContent=d.status==="degraded"?"勝敗自動検出 要確認":"勝敗自動検出 停止"}
  function updateStatsHealth(d){const bad=d.status==="error";statsWarning.style.display=bad?"block":"none";if(bad){statsPanel.style.display="none";hideMilestone()}else if(statsEnabled){refreshStats()}}
  function handleJson(e,fn){try{fn(JSON.parse(e.data))}catch(err){console.error("[SSE]",err,e.data)}}
  function handleEffect(p){
    const created=p.created_at_ms,age=Date.now()-created;
    if(p.effect!=="milestone"||typeof p.effect_id!=="string"||!p.effect_id||
       !Number.isInteger(created)||created<overlayStartedAt||age<0||age>=effectTtlMs||
       seenEffects.has(p.effect_id)||created<lastEffectCreatedAt)return;
    for(const [id,stamp] of seenEffects)if(Date.now()-stamp>=effectTtlMs)seenEffects.delete(id);
    seenEffects.set(p.effect_id,created);lastEffectCreatedAt=created;
    flashMilestone(p.milestone);
  }

  const es=new EventSource("/events");
  es.addEventListener("stats",e=>handleJson(e,updateStats));
  es.addEventListener("detector",e=>handleJson(e,updateDetector));
  es.addEventListener("stats_health",e=>handleJson(e,updateStatsHealth));
  es.addEventListener("lifetime",e=>handleJson(e,d=>{latestLifetime=d;refreshStats()}));
  es.addEventListener("config_health",e=>handleJson(e,d=>{const bad=d.status==="degraded";configWarning.style.display=bad?"block":"none";if(bad)configWarning.textContent="設定ファイル異常（前回正常値で継続）"}));
  es.addEventListener("effect",e=>handleJson(e,handleEffect));
  es.onerror=e=>console.error("[SSE] reconnecting",e);
})();
</script>
</body>
</html>
