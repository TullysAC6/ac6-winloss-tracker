<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AC6 Win/Loss Tracker</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{font-family:"Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif}
#stats-panel{position:fixed;left:22px;top:22px;z-index:1000;display:none;padding:10px 14px 8px;background:rgba(0,0,0,.50);border:1px solid rgba(255,255,255,.30);border-radius:6px;color:#fff;font-size:24px;font-weight:800;text-shadow:0 2px 2px #000;pointer-events:none}
#stats-panel .status{margin-left:12px;font-weight:900}
#stats-panel .sub{display:block;margin-top:3px;font-size:15px;opacity:.80;text-align:right}
#stats-panel.hot-1 .status{color:#ffb04a;animation:slowBlink 1.6s steps(2,end) infinite;text-shadow:0 0 3px rgba(255,140,50,.65),0 2px 2px #000}
#stats-panel.hot-2 .status{color:#ff4a3d;animation:blink .9s steps(2,end) infinite;text-shadow:0 0 5px rgba(255,55,35,.80),0 2px 2px #000}
#stats-panel.hot-3 .status{color:#ffd740;animation:blink .65s steps(2,end) infinite;text-shadow:0 0 6px #ffb300,0 2px 2px #000}
#stats-panel.hot-4 .status{color:#fff176;animation:blink .5s steps(2,end) infinite;text-shadow:0 0 8px #ffd600,0 2px 2px #000}
#stats-panel.hot-5{border-color:#ffe66a}
#stats-panel.hot-5 .status{color:#fff;animation:rushBlink .42s steps(2,end) infinite;text-shadow:0 0 9px #ffe45c,0 2px 2px #000}
.health-warning{position:fixed;right:18px;z-index:1200;display:none;padding:6px 9px;background:rgba(120,0,0,.82);color:#fff;font-size:16px;font-weight:900;border-radius:4px;pointer-events:none}
#detector-warning{top:18px}
#stats-warning{top:54px}
#config-warning{top:90px}
#milestone{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;pointer-events:none}
#milestone.show{display:flex}
#milestone .inner{position:relative;padding:18px 42px;background:linear-gradient(180deg,rgba(90,12,0,.90),rgba(10,0,0,.86));border:3px solid #ffd94a;border-radius:8px;color:#fff166;font-size:68px;font-weight:900;letter-spacing:.04em;box-shadow:0 0 12px rgba(255,190,40,.45),inset 0 0 10px rgba(255,220,80,.18);text-shadow:0 0 4px #ff9c20,0 3px 4px #000;animation:milestone 1.8s ease-out forwards}
#milestone .inner::before,#milestone .inner::after{content:"";position:absolute;left:8%;right:8%;height:2px;background:rgba(255,230,100,.85);box-shadow:0 0 5px rgba(255,205,60,.7)}
#milestone .inner::before{top:7px}
#milestone .inner::after{bottom:7px}
@keyframes slowBlink{0%,62%{opacity:1}63%,100%{opacity:.55}}
@keyframes blink{0%,46%{opacity:1}47%,100%{opacity:.28}}
@keyframes rushBlink{0%,42%{opacity:1}43%,100%{opacity:.18}}
@keyframes milestone{0%{opacity:0;transform:scale(.82)}12%{opacity:1;transform:scale(1.08)}28%{opacity:.45;transform:scale(1)}42%{opacity:1;transform:scale(1.04)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.02)}}
</style>
</head>
<body>
<div id="stats-panel"><span class="record"></span><span class="rate"></span><span class="streak"></span><span class="status"></span><span class="sub"></span></div>
<div id="detector-warning" class="health-warning">勝敗自動検出 停止</div>
<div id="stats-warning" class="health-warning">戦績データ異常</div>
<div id="config-warning" class="health-warning">設定ファイル異常</div>
<div id="milestone"><div class="inner"></div></div>
<script>
(async()=>{
  const statsPanel=document.getElementById("stats-panel");
  const detectorWarning=document.getElementById("detector-warning");
  const statsWarning=document.getElementById("stats-warning");
  const configWarning=document.getElementById("config-warning");
  const milestone=document.getElementById("milestone");
  const milestoneInner=milestone.querySelector(".inner");
  let statsEnabled=true,latestStats=null,milestoneTimer=null;

  async function fetchConfig(){const r=await fetch("/config",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
  function hideMilestone(){milestone.classList.remove("show");if(milestoneTimer){clearTimeout(milestoneTimer);milestoneTimer=null}}
  function applyConfig(c){statsEnabled=c.stats_enabled!==false;if(!statsEnabled){statsPanel.style.display="none";hideMilestone()}else if(latestStats){renderStats(latestStats)}const h=c.config_health||{};const bad=h.status==="degraded";configWarning.style.display=bad?"block":"none";if(bad)configWarning.textContent="設定ファイル異常（前回正常値で継続）"}
  try{applyConfig(await fetchConfig())}catch(e){console.error("[config]",e)}
  setInterval(async()=>{try{applyConfig(await fetchConfig())}catch(e){console.error("[config]",e)}},3000);

  function milestoneText(n){if(n>=20)return"20連勝　RUSH突入！！";if(n>=15)return"15連勝　覚醒ゾーン突入";if(n>=10)return"10連勝　超激アツ！！";return"5連勝　激アツ！！"}
  function flashMilestone(n){if(!statsEnabled||!n)return;if(milestoneTimer)clearTimeout(milestoneTimer);milestoneInner.textContent=milestoneText(Number(n));milestone.classList.remove("show");void milestone.offsetWidth;milestone.classList.add("show");milestoneTimer=setTimeout(()=>{milestone.classList.remove("show");milestoneTimer=null},1900)}
  function renderStats(s){if(!statsEnabled){statsPanel.style.display="none";return}statsPanel.style.display="block";statsPanel.querySelector(".record").textContent=`WIN ${s.wins}　LOSE ${s.losses}`;statsPanel.querySelector(".rate").textContent=`　勝率 ${Number(s.win_rate).toFixed(1)}%`;statsPanel.querySelector(".streak").textContent=`　連勝 ${s.streak}`;statsPanel.querySelector(".status").textContent=s.status_level?`　${s.status}`:"";statsPanel.querySelector(".sub").textContent=`最高連勝 ${s.best_streak}`;statsPanel.className="";statsPanel.id="stats-panel";if(s.status_level)statsPanel.classList.add("hot-"+s.status_level)}
  function updateStats(s){latestStats=s;renderStats(s)}
  function updateDetector(d){const bad=d.status==="error"||d.status==="degraded";detectorWarning.style.display=bad?"block":"none";if(bad)detectorWarning.textContent=d.status==="degraded"?"勝敗自動検出 要確認":"勝敗自動検出 停止"}
  function updateStatsHealth(d){const bad=d.status==="error";statsWarning.style.display=bad?"block":"none";if(bad){statsPanel.style.display="none";hideMilestone()}else if(statsEnabled&&latestStats){renderStats(latestStats)}}
  function handleJson(e,fn){try{fn(JSON.parse(e.data))}catch(err){console.error("[SSE]",err,e.data)}}

  const es=new EventSource("/events");
  es.addEventListener("stats",e=>handleJson(e,updateStats));
  es.addEventListener("detector",e=>handleJson(e,updateDetector));
  es.addEventListener("stats_health",e=>handleJson(e,updateStatsHealth));
  es.addEventListener("config_health",e=>handleJson(e,d=>{const bad=d.status==="degraded";configWarning.style.display=bad?"block":"none";if(bad)configWarning.textContent="設定ファイル異常（前回正常値で継続）"}));
  es.addEventListener("effect",e=>handleJson(e,p=>{if(p.effect==="milestone"&&(!p.created_at_ms||Date.now()-Number(p.created_at_ms)<3000))flashMilestone(p.milestone)}));
  es.onerror=e=>console.error("[SSE] reconnecting",e);
})();
</script>
</body>
</html>
